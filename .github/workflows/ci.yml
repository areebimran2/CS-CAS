name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned rather than ubuntu-latest, which changes when GitHub releases a new Ubuntu. setup-python only has
    # builds of some Python versions for each Ubuntu release, so check the version in .python-version is built
    # for this one before changing either: https://github.com/actions/python-versions/releases
    runs-on: ubuntu-26.04
    services:
      db:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: cs_cas
          POSTGRES_USER: cs_cas
          POSTGRES_PASSWORD: ci-password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U cs_cas -d cs_cas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      POSTGRES_DB: cs_cas
      POSTGRES_USER: cs_cas
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Required by settings.py. No Redis runs in CI: the tests use an in-memory cache (see conftest.py).
      REDIS_URL: redis://localhost:6379/0
      # Required by settings.py. Nothing in the tests talks to object storage.
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-only-not-a-real-secret
      S3_BUCKET_NAME: cs-cas
      S3_PUBLIC_URL: http://localhost:9000/cs-cas

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python (version from .python-version)
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies from the lockfiles
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Django system checks
        run: python manage.py check

      # --no-input stops Django asking questions (such as "was this field renamed?") that nobody can answer in CI.
      - name: Check every model change has a migration
        run: python manage.py makemigrations --check --dry-run --no-input

      # pytest-django creates a test database and applies every migration to it first,
      # so this step also checks that the migrations run in order on an empty database.
      - name: Run tests
        run: pytest
